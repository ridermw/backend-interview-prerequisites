services:
  # Main application server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slack-interview-app
    ports:
      - "3033:3033"
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run dev-ts
    # File watch for auto-rebuild (Docker 4.20+)
    develop:
      watch:
        - path: ./src
          action: rebuild
        - path: ./package.json
          action: rebuild

  # Watch mode for prettier and tests
  watch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slack-interview-watch
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: npm run test:watch
    stdin_open: true
    tty: true
